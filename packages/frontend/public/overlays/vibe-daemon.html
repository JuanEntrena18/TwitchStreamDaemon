<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamDaemon – Vibe Daemons Fortnite Cartoon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:ital,wght@0,700;0,900;1,900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: 'Barlow Condensed', sans-serif;
  }

  #stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    gap: 26px;
    padding: 60px;
    pointer-events: none;
    z-index: 10;
  }

  #demo-badge {
    position: absolute; top: 24px; right: 32px;
    padding: 8px 22px;
    background: #ffd600;
    border: 4px solid #090b14;
    box-shadow: 6px 6px 0 #090b14;
    border-radius: 10px;
    color: #090b14;
    font-size: 26px; font-weight: 900; letter-spacing: 2px;
    text-transform: uppercase;
    transform: skewX(-6deg);
    opacity: 0;
    transition: opacity .3s;
    z-index: 20;
  }
  #demo-badge.show { opacity: 1; }

  /* ───────── FORTNITE CARTOON ALERT CARD ───────── */
  .vibe-card {
    position: relative;
    --accent-hex: #00d8ff;
    --accent-rgb: 0, 216, 255;
    display: flex; flex-direction: column; align-items: center;
    padding: 30px 68px 28px;
    border-radius: 22px;
    text-align: center;
    background:
      radial-gradient(circle at 50% 0%, rgba(var(--accent-rgb), 0.35), transparent 62%),
      linear-gradient(155deg, #1a2142 0%, #10142a 100%);
    border: 5px solid #090b14;
    box-shadow:
      10px 10px 0 #090b14,
      0 0 0 3px var(--accent-hex),
      0 26px 60px rgba(0, 0, 0, 0.55);
    will-change: transform, opacity;
    opacity: 0;
    transform: translate3d(0, 60px, 0) scale(0.55) rotate(-4deg);
  }

  .vibe-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 17px;
    background-image: radial-gradient(rgba(255, 255, 255, 0.08) 2px, transparent 2px);
    background-size: 16px 16px;
    pointer-events: none;
  }

  .vibe-card.visible {
    animation: comic-pop-in 0.52s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .vibe-card.hiding {
    animation: comic-pop-out 0.38s ease-in forwards;
  }

  @keyframes comic-pop-in {
    0%   { opacity: 0; transform: translate3d(0, 64px, 0) scale(0.5) rotate(-5deg); }
    65%  { opacity: 1; transform: translate3d(0, -10px, 0) scale(1.06) rotate(2deg); }
    100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
  }
  @keyframes comic-pop-out {
    0%   { opacity: 1; transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate3d(0, -56px, 0) scale(0.75) rotate(3deg); }
  }

  .vibe-ribbon {
    position: relative;
    z-index: 2;
    margin-bottom: 12px;
    padding: 5px 22px;
    background: var(--accent-hex);
    color: #090b14;
    border: 3.5px solid #090b14;
    border-radius: 8px;
    box-shadow: 4px 4px 0 #090b14;
    transform: skewX(-8deg);
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .vibe-ribbon span {
    display: inline-block;
    transform: skewX(8deg);
  }

  .vibe-icon {
    position: relative;
    z-index: 2;
    font-size: 112px;
    line-height: 1;
    margin-bottom: 8px;
    filter: drop-shadow(5px 5px 0 #090b14);
    animation: icon-bounce 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes icon-bounce {
    0%   { transform: translate3d(0, 0, 0) scale(0.2) rotate(-20deg); }
    65%  { transform: translate3d(0, 0, 0) scale(1.22) rotate(8deg); }
    100% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
  }

  .vibe-title {
    position: relative;
    z-index: 2;
    font-family: 'Barlow Condensed', sans-serif;
    font-style: italic;
    font-size: 76px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #ffffff;
    -webkit-text-stroke: 3px #090b14;
    text-shadow:
      6px 6px 0 #090b14,
      0 0 24px rgba(var(--accent-rgb), 0.55);
    max-width: 1400px;
    line-height: 1.05;
  }

  .vibe-sub {
    position: relative;
    z-index: 2;
    margin-top: 8px;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent-hex);
    text-shadow: 3px 3px 0 #090b14;
  }

  /* ───────── MEDIA MODE (webm / gif + cartoon caption) ───────── */
  .vibe-media-wrap {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    will-change: transform, opacity;
    opacity: 0;
    transform: translate3d(0, 56px, 0) scale(0.65);
  }
  .vibe-media-wrap.visible {
    animation: comic-pop-in 0.52s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .vibe-media-wrap.hiding {
    animation: comic-pop-out 0.38s ease-in forwards;
  }

  .vibe-media {
    position: relative;
    height: var(--media-h, 44vh);
    max-width: 80vw;
    border-radius: 20px;
    overflow: hidden;
    border: 5px solid #090b14;
    box-shadow:
      10px 10px 0 #090b14,
      0 0 0 3px var(--accent-hex);
  }
  .vibe-media video,
  .vibe-media img {
    height: 100%;
    width: auto;
    max-width: 80vw;
    object-fit: contain;
    display: block;
  }

  .vibe-media-text {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 46px 28px 22px;
    background: linear-gradient(180deg, transparent 0%, rgba(9, 11, 20, 0.92) 72%);
    text-align: center;
  }
  .vibe-media-text .vibe-title { font-size: 58px; }
  .vibe-media-text .vibe-sub { font-size: 24px; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="demo-badge">DEMO FORTNITE</div>

<script>
(function () {
  'use strict';

  var PARAMS      = new URLSearchParams(location.search);
  var CHANNEL     = (PARAMS.get('channel') || '').toLowerCase();
  var DEMO_MODE   = PARAMS.get('demo') === 'true';
  var BACKEND_URL = PARAMS.get('backend') || 'http://localhost:3000';
  var POS         = PARAMS.get('pos') || 'center';
  var MEDIA_H     = Math.max(10, Math.min(90, parseInt(PARAMS.get('size') || '44', 10) || 44));
  var MAX_CARDS   = 2;

  var stage = document.getElementById('stage');
  stage.style.setProperty('--media-h', MEDIA_H + 'vh');

  var POSITIONS = {
    'top':          ['flex-start', 'center'],
    'center':       ['center', 'center'],
    'bottom':       ['flex-end', 'center'],
    'top-left':     ['flex-start', 'flex-start'],
    'top-right':    ['flex-start', 'flex-end'],
    'bottom-left':  ['flex-end', 'flex-start'],
    'bottom-right': ['flex-end', 'flex-end'],
    'left':         ['center', 'flex-start'],
    'right':        ['center', 'flex-end'],
  };
  var pos = POSITIONS[POS] || POSITIONS.center;
  stage.style.justifyContent = pos[0];
  stage.style.alignItems = pos[1];

  var EVENTS = {
    kill:            { label: '¡ELIMINACIÓN!',      icon: '🔥', hex: '#ff6b00', rgb: '255, 107, 0' },
    death:           { label: 'ELIMINADO',          icon: '💀', hex: '#ff3366', rgb: '255, 51, 102' },
    victory:         { label: '¡VICTORIA MAGISTRAL!', icon: '👑', hex: '#ffd600', rgb: '255, 214, 0' },
    kill_streak:     { label: '¡RACHA IMPARABLE!',  icon: '⚡', hex: '#c084fc', rgb: '192, 132, 252' },
    victory_streak:  { label: '¡RACHA DE CORONAS!', icon: '🏆', hex: '#22c55e', rgb: '34, 197, 94' },
    low_health:      { label: '¡VIDA CRÍTICA!',     icon: '🩸', hex: '#ff3366', rgb: '255, 51, 102' },
    low_shield:      { label: '¡ESCUDO ROTO!',      icon: '🛡️', hex: '#00d8ff', rgb: '0, 216, 255' },
    storm_shrinking: { label: '¡LA TORMENTA AVANZA!', icon: '🌀', hex: '#a855f7', rgb: '168, 85, 247' },
    manual:          { label: 'VIBE DAEMON',        icon: '✨', hex: '#00d8ff', rgb: '0, 216, 255' },
  };

  function catalog(eventType) {
    return EVENTS[eventType] || EVENTS.manual;
  }

  function playSound(soundUrl, volume) {
    if (!soundUrl) return;
    var url = /^https?:\/\//.test(soundUrl) ? soundUrl : BACKEND_URL + soundUrl;
    try {
      var audio = new Audio(url);
      audio.volume = Math.max(0, Math.min(1, typeof volume === 'number' ? volume : 0.7));
      audio.play().catch(function () {});
    } catch (e) { /* ignore */ }
  }

  function applyTemplate(str, activation) {
    var ev = catalog(activation.eventType);
    var vars = {
      trigger: activation.triggerName || '',
      game: String(activation.gameId || 'FORTNITE').toUpperCase(),
      event: ev.label,
    };
    return String(str || '').replace(/\{\{(\w+)\}\}/g, function (_, key) {
      return vars[key] != null ? vars[key] : '{{' + key + '}}';
    });
  }

  function buildCard(activation) {
    var ev = catalog(activation.eventType);
    var action = activation.action || {};
    var duration = Math.max(500, action.durationMs || 3200);
    var message = applyTemplate(action.message, activation) || activation.triggerName || ev.label;
    var gameLabel = String(activation.gameId || 'FORTNITE').toUpperCase();

    var wrap;
    var mediaUrl = action.mediaUrl || '';

    if (mediaUrl) {
      wrap = document.createElement('div');
      wrap.className = 'vibe-media-wrap';
      var mediaBox = document.createElement('div');
      mediaBox.className = 'vibe-media';

      if (/\.(webm|mp4|mov)(\?|$)/i.test(mediaUrl)) {
        var video = document.createElement('video');
        video.src = /^https?:\/\//.test(mediaUrl) ? mediaUrl : BACKEND_URL + mediaUrl;
        video.autoplay = true; video.loop = true; video.muted = true;
        video.setAttribute('playsinline', '');
        mediaBox.appendChild(video);
      } else {
        var img = document.createElement('img');
        img.src = /^https?:\/\//.test(mediaUrl) ? mediaUrl : BACKEND_URL + mediaUrl;
        img.alt = message;
        mediaBox.appendChild(img);
      }

      var mediaText = document.createElement('div');
      mediaText.className = 'vibe-media-text';
      var mTitle = document.createElement('div');
      mTitle.className = 'vibe-title';
      mTitle.textContent = message;
      var mSub = document.createElement('div');
      mSub.className = 'vibe-sub';
      mSub.textContent = ev.label + ' · ' + gameLabel;
      mediaText.appendChild(mTitle);
      mediaText.appendChild(mSub);
      mediaBox.appendChild(mediaText);
      wrap.appendChild(mediaBox);
    } else {
      wrap = document.createElement('div');
      wrap.className = 'vibe-card';

      var ribbon = document.createElement('div');
      ribbon.className = 'vibe-ribbon';
      var ribbonSpan = document.createElement('span');
      ribbonSpan.textContent = gameLabel + ' · ' + ev.label;
      ribbon.appendChild(ribbonSpan);

      var icon = document.createElement('div');
      icon.className = 'vibe-icon';
      icon.textContent = ev.icon;

      var title = document.createElement('div');
      title.className = 'vibe-title';
      title.textContent = message;

      wrap.appendChild(ribbon);
      wrap.appendChild(icon);
      wrap.appendChild(title);
    }

    wrap.style.setProperty('--accent-hex', ev.hex);
    wrap.style.setProperty('--accent-rgb', ev.rgb);

    requestAnimationFrame(function () {
      wrap.classList.add('visible');
    });

    setTimeout(function () {
      wrap.classList.add('hiding');
      setTimeout(function () {
        if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      }, 420);
    }, duration);

    return wrap;
  }

  function triggerVibe(activation) {
    if (!activation || !activation.eventType) return;
    while (stage.children.length >= MAX_CARDS) {
      stage.removeChild(stage.firstChild);
    }
    stage.appendChild(buildCard(activation));
    var action = activation.action || {};
    playSound(action.soundUrl, action.volume);
  }

  function initSocket() {
    var socket;
    try { socket = io(BACKEND_URL, { transports: ['websocket'] }); }
    catch (e) { return; }

    socket.on('connect', function () {
      socket.emit('join:channel', 'global');
      if (CHANNEL) socket.emit('join:channel', CHANNEL);
    });

    socket.on('vibe-daemon:activation', function (activation) {
      triggerVibe(activation);
    });
  }

  function startDemo() {
    document.getElementById('demo-badge').classList.add('show');
    var demoTypes = [
      'kill', 'low_shield', 'storm_shrinking', 'kill_streak', 'low_health', 'victory',
    ];
    var names = {
      kill: '¡ELIMINACIÓN CONFIRMADA!',
      victory: '👑 ¡VICTORIA MAGISTRAL!',
      kill_streak: '⚡ ¡RACHA DE 5 ELIMINACIONES!',
      low_shield: '🛡️ ¡SIN ESCUDO! ¡TOMA MINIS!',
      storm_shrinking: '🌀 ¡A LA ZONA! TORMENTA EN CAMINO',
      low_health: '🩸 ¡VIDA CRÍTICA! ¡BOTIQUÍN YA!',
    };
    var i = 0;
    function loop() {
      var type = demoTypes[i % demoTypes.length];
      i++;
      triggerVibe({
        triggerId: 'demo-' + type,
        triggerName: names[type] || 'Vibe Daemon',
        eventType: type,
        gameId: 'fortnite',
        action: { type: 'overlay', overlayId: 'vibe-daemon', durationMs: 3200, message: names[type] },
        channel: CHANNEL || 'demo',
        timestamp: Date.now(),
      });
      setTimeout(loop, 5000);
    }
    setTimeout(loop, 900);
  }

  function loadSocketIO(cb) {
    var script = document.createElement('script');
    script.onload = function () { cb(null); };
    script.onerror = function () { cb(new Error('load failed')); };
    script.src = './js/socket.io.js';
    document.head.appendChild(script);
  }

  loadSocketIO(function (err) {
    if (!err) initSocket();
    if (DEMO_MODE) startDemo();
  });
})();
</script>
</body>
</html>
