<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamForge – Fortnite Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blue:    #00D4FF;
    --yellow:  #FFD700;
    --purple:  #C84BFF;
    --green:   #00FF88;
    --dark:    #0A0E1A;
    --panel:   rgba(10, 14, 26, 0.86);
    --stroke:  rgba(0, 212, 255, 0.38);
  }

  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: 'Barlow Condensed', sans-serif;
    user-select: none;
  }

  /* ──────────────────────────────────── MODO WIDGET INDEPENDIENTE (?widget=...) */
  body.widget-standalone {
    width: 100vw !important;
    height: 100vh !important;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 8px;
  }
  body.widget-standalone #particles,
  body.widget-standalone .scan-line,
  body.widget-standalone .corner,
  body.widget-standalone #edit-toolbar {
    display: none !important;
  }
  body.widget-standalone [data-widget-id] {
    display: none !important;
  }
  body.widget-standalone [data-widget-id].widget-active {
    display: flex !important;
    position: relative !important;
    top: auto !important;
    left: auto !important;
    right: auto !important;
    bottom: auto !important;
    transform: none !important;
    margin: 0 !important;
  }
  body.widget-standalone[data-active-widget="info-bar"] {
    padding: 0;
    align-items: flex-end;
  }
  body.widget-standalone[data-active-widget="info-bar"] #stream-title-bar.widget-active {
    width: 100vw !important;
  }
  body.widget-standalone[data-active-widget="alerts"] {
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  body.widget-standalone[data-active-widget="alerts"] #alert-zone.widget-active {
    width: 100%;
    height: 100%;
    justify-content: center;
    align-items: center;
  }
  body.widget-standalone[data-active-widget="chat"] #fn-chat.widget-active {
    width: calc(100vw - 16px);
    height: calc(100vh - 16px);
    max-height: none;
  }

  /* Capas ocultas mediante ?hide=a,b */
  [data-widget-id].widget-hidden {
    display: none !important;
  }

  /* ──────────────────────────────────── MODO INTERACTIVO DRAG & DROP (?edit=true) */
  body.edit-mode {
    background: radial-gradient(circle at center, rgba(10, 14, 26, 0.45) 0%, rgba(10, 14, 26, 0.82) 100%);
  }
  body.edit-mode [data-widget-id] {
    cursor: grab !important;
     pointer-events: auto !important;
    outline: 2px dashed rgba(0, 212, 255, 0.75);
    outline-offset: 6px;
    transition: outline-color 0.15s ease, box-shadow 0.15s ease;
  }
  body.edit-mode [data-widget-id]:hover {
    outline-color: var(--yellow);
    box-shadow: 0 0 24px rgba(0, 212, 255, 0.35);
  }
  body.edit-mode [data-widget-id].dragging {
    cursor: grabbing !important;
    outline: 2px solid var(--yellow);
    z-index: 999 !important;
  }
  body.edit-mode #alert-zone {
    min-width: 440px;
    min-height: 130px;
    background: rgba(0, 212, 255, 0.06);
  }
  body.edit-mode #alert-zone::after {
    content: '🔔 ZONA DE ALERTAS (ARRASTRAR AQUÍ)';
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--blue);
    padding: 12px 20px;
    pointer-events: none;
  }

  #edit-toolbar {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2000;
    display: none;
    align-items: center;
    gap: 12px;
    background: rgba(10, 14, 26, 0.95);
    border: 2px solid var(--blue);
    padding: 8px 18px;
    clip-path: polygon(2% 0, 100% 0, 98% 100%, 0 100%);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
  }
  body.edit-mode #edit-toolbar {
    display: flex;
  }
  .edit-toolbar-title {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--blue);
    text-transform: uppercase;
  }
  .edit-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 14px;
    border: 1px solid var(--stroke);
    background: rgba(0, 212, 255, 0.14);
    color: #fff;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .edit-btn:hover {
    background: var(--blue);
    color: var(--dark);
  }
  .edit-btn.warn {
    border-color: rgba(255, 215, 0, 0.45);
    background: rgba(255, 215, 0, 0.14);
    color: var(--yellow);
  }
  .edit-btn.warn:hover {
    background: var(--yellow);
    color: var(--dark);
  }

  /* ──────────────────────────────────── CANVAS DE PARTÍCULAS */
  #particles {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* ──────────────────────────────────── 1. HUD ESQUINA SUPERIOR IZQUIERDA (stream-stats) */
  #hud {
    position: absolute;
    top: 28px; left: 28px;
    display: flex; flex-direction: column; gap: 10px;
    z-index: 20;
  }

  .stat-row {
    display: flex; align-items: center; gap: 0;
    position: relative;
  }

  .stat-icon-wrap {
    width: 46px; height: 46px;
    background: var(--blue);
    clip-path: polygon(0 0, 85% 0, 100% 15%, 100% 100%, 15% 100%, 0 85%);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    position: relative; z-index: 2;
  }
  .stat-icon-wrap.yellow { background: var(--yellow); }
  .stat-icon-wrap.purple { background: var(--purple); }

  .stat-icon-wrap svg {
    width: 22px; height: 22px;
    fill: var(--dark);
  }

  .stat-body {
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-left: none;
    padding: 5px 18px 5px 14px;
    clip-path: polygon(0 0, 100% 0, 100% 75%, 94% 100%, 0 100%);
    min-width: 135px;
    position: relative;
  }

  .stat-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 600;
    letter-spacing: 2.5px; text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    line-height: 1;
  }

  .stat-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 26px; font-weight: 900;
    color: #ffffff;
    line-height: 1.05;
    letter-spacing: 1px;
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.25s ease;
    display: inline-block;
  }

  .stat-value.blue  { color: var(--blue); }
  .stat-value.yellow{ color: var(--yellow); }
  .stat-value.purple{ color: var(--purple); }
  .stat-value.pop   { transform: scale(1.22); }

  /* ──────────────────────────────────── 2. PANEL DERECHO: TIEMPO + TRAYECTORIA (career-stats) */
  #right-panel {
    position: absolute;
    top: 28px; right: 28px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    min-width: 220px;
    z-index: 20;
  }

  #uptime-block {
    background: var(--panel);
    border: 1px solid var(--stroke);
    padding: 10px 22px;
    clip-path: polygon(6% 0, 100% 0, 100% 80%, 94% 100%, 0 100%, 0 20%);
    text-align: center;
  }

  .uptime-label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--blue);
    line-height: 1;
    margin-bottom: 4px;
  }

  .uptime-value {
    font-size: 38px; font-weight: 900;
    color: #ffffff;
    letter-spacing: 3px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  #fn-stats {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .fn-stat-group {
    background: var(--panel);
    border: 1px solid var(--stroke);
    padding: 10px 16px;
    clip-path: polygon(4% 0, 100% 0, 100% 88%, 95% 100%, 0 100%, 0 12%);
  }

  .fn-stat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
    padding-bottom: 5px;
    border-bottom: 1px solid rgba(0,212,255,0.2);
  }

  .fn-stat-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--blue);
  }

  .fn-api-pill {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 1px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    background: rgba(0, 212, 255, 0.14);
    border: 1px solid rgba(0, 212, 255, 0.35);
    color: var(--blue);
  }
  .fn-api-pill.ok {
    background: rgba(0, 255, 136, 0.14);
    border-color: rgba(0, 255, 136, 0.45);
    color: var(--green);
  }

  .fn-stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 3px 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 0.5px;
  }

  .fn-stat-label { color: rgba(255,255,255,0.62); font-weight: 600; text-transform: uppercase; }
  .fn-stat-value { color: var(--blue); font-weight: 900; font-size: 17px; }
  .fn-stat-value.yellow { color: var(--yellow); }
  .fn-stat-value.purple { color: var(--purple); }

  /* ──────────────────────────────────── 3. CHAT BOX (chat) */
  .fn-chat {
    position: absolute;
    bottom: 74px;
    left: 28px;
    width: 390px;
    height: 330px;
    max-height: 340px;
    background: var(--panel);
    border: 1px solid rgba(0,212,255,0.32);
    clip-path: polygon(2% 0, 100% 0, 100% 94%, 98% 100%, 0 100%, 0 6%);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow: hidden;
    z-index: 20;
  }
  .fn-chat.right { left: auto; right: 28px; }
  .fn-chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--blue);
    border-bottom: 1px solid rgba(0,212,255,0.2);
    padding-bottom: 5px;
  }
  .fn-chat-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }
  .fn-chat-messages {
    display: flex; flex-direction: column;
    gap: 4px;
    overflow-y: auto;
    flex: 1;
    scrollbar-width: none;
  }
  .fn-chat-messages::-webkit-scrollbar { display: none; }
  .fn-chat-msg {
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    line-height: 1.38;
    padding: 3px 6px;
    border-left: 2px solid rgba(0, 212, 255, 0.35);
    background: rgba(255, 255, 255, 0.025);
    word-break: break-word;
    animation: msg-in 0.2s ease-out;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .fn-chat-msg .un { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; margin-right: 4px; }
  .fn-chat-msg .txt { color: rgba(255,255,255,0.88); }

  /* ──────────────────────────────────── 4. ÚLTIMO FOLLOW (recent-follow) */
  #recent-follow {
    position: absolute;
    bottom: 74px; right: 28px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    padding: 10px 18px;
    clip-path: polygon(4% 0, 100% 0, 100% 82%, 96% 100%, 0 100%, 0 18%);
    min-width: 245px; max-width: 320px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 20;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }
  #recent-follow.flash {
    transform: scale(1.06);
    border-color: var(--yellow);
  }
  .rf-icon {
    width: 36px; height: 36px;
    background: rgba(0, 212, 255, 0.16);
    border: 1px solid var(--blue);
    display: flex; align-items: center; justify-content: center;
    color: var(--blue);
    font-size: 18px;
    flex-shrink: 0;
  }
  .rf-content {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .rf-label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--blue); margin-bottom: 2px;
  }
  .rf-name {
    font-size: 22px; font-weight: 900;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ──────────────────────────────────── 5. BARRA INFERIOR DE INFO DEL DIRECTO (info-bar) */
  #stream-title-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: linear-gradient(90deg, var(--dark) 0%, rgba(10,14,26,0.94) 70%, rgba(10,14,26,0.75) 100%);
    border-top: 2px solid var(--blue);
    display: flex; align-items: center; gap: 14px;
    padding: 0 32px;
    overflow: hidden;
    z-index: 20;
  }

  #live-badge {
    background: #FF3B3B;
    padding: 4px 12px;
    font-size: 13px; font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
    flex-shrink: 0;
    animation: pulse-live 1.8s ease-in-out infinite;
  }

  @keyframes pulse-live {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.65; }
  }

  #broadcaster-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 12px;
    background: rgba(0, 212, 255, 0.12);
    border: 1px solid rgba(0, 212, 255, 0.35);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--blue);
    text-transform: uppercase;
    flex-shrink: 0;
  }

  #game-label {
    font-size: 13px; font-weight: 700;
    color: var(--yellow);
    text-transform: uppercase;
    letter-spacing: 2px;
    flex-shrink: 0;
  }

  #title-sep { color: rgba(255,255,255,0.3); font-size: 18px; flex-shrink: 0; }

  #title-text {
    font-family: 'Barlow', sans-serif;
    font-size: 14px; font-weight: 600;
    color: rgba(255,255,255,0.9);
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #title-deco {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(0,212,255,0.4) 0%, transparent 100%);
    margin: 0 16px;
  }

  /* ──────────────────────────────────── 6. ALERTAS CENTRALES (alerts) */
  #alert-zone {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
    gap: 16px;
    pointer-events: none;
    z-index: 30;
  }

  .alert-card {
    background: var(--panel);
    border: 2px solid var(--blue);
    padding: 18px 40px;
    clip-path: polygon(0 0, 97% 0, 100% 10%, 100% 100%, 3% 100%, 0 90%);
    text-align: center;
    min-width: 420px;
    animation: alert-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
               alert-out 0.4s ease-in 4.6s forwards;
    position: relative;
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
  }

  .alert-card::before {
    content: '';
    position: absolute; top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,212,255,0.08), transparent);
    animation: shimmer 2s 0.4s ease-in-out infinite;
  }

  .alert-card.sub,
  .alert-card.resub,
  .alert-card.subgift { border-color: var(--purple); }
  .alert-card.sub::before,
  .alert-card.resub::before,
  .alert-card.subgift::before { background: linear-gradient(90deg, transparent, rgba(200,75,255,0.12), transparent); }
  .alert-card.bits,
  .alert-card.cheer,
  .alert-card.raid { border-color: var(--yellow); }
  .alert-card.bits::before,
  .alert-card.cheer::before,
  .alert-card.raid::before { background: linear-gradient(90deg, transparent, rgba(255,215,0,0.12), transparent); }

  @keyframes shimmer {
    0%   { left: -60%; }
    100% { left: 160%; }
  }

  @keyframes alert-in {
    from { opacity: 0; transform: scale(0.7) translateY(30px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes alert-out {
    from { opacity: 1; transform: scale(1) translateY(0); }
    to   { opacity: 0; transform: scale(0.8) translateY(-20px); }
  }

  .alert-type {
    font-size: 11px; font-weight: 700;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--blue); margin-bottom: 4px;
  }
  .alert-card.sub .alert-type,
  .alert-card.resub .alert-type,
  .alert-card.subgift .alert-type { color: var(--purple); }
  .alert-card.bits .alert-type,
  .alert-card.cheer .alert-type,
  .alert-card.raid .alert-type { color: var(--yellow); }

  .alert-user {
    font-size: 36px; font-weight: 900;
    color: #fff; line-height: 1;
    letter-spacing: 1px;
  }

  .alert-detail {
    font-size: 15px; font-weight: 600;
    color: rgba(255,255,255,0.72);
    margin-top: 6px; letter-spacing: 1px;
  }

  .alert-msg {
    font-family: 'Barlow', sans-serif;
    font-size: 13px; font-weight: 400;
    color: rgba(255,255,255,0.58);
    margin-top: 4px;
    font-style: italic;
  }

  /* ──────────────────────────────────── ESCÁNER Y ESQUINAS DECORATIVAS */
  .scan-line {
    position: absolute; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--blue) 50%, transparent 100%);
    opacity: 0.18;
    animation: scan 8s linear infinite;
    pointer-events: none;
  }
  @keyframes scan {
    from { top: 0; }
    to   { top: 1080px; }
  }

  .corner {
    position: absolute;
    width: 40px; height: 40px;
    pointer-events: none;
  }
  .corner svg { width: 100%; height: 100%; }
  .corner.tl { top: 0; left: 0; }
  .corner.tr { top: 0; right: 0; transform: scaleX(-1); }
  .corner.bl { bottom: 0; left: 0; transform: scaleY(-1); }
  .corner.br { bottom: 60px; right: 0; transform: scale(-1,-1); }

  /* ──────────────────────────────────── DEMO & OFFLINE BADGES */
  #demo-badge {
    position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
    background: rgba(245,158,11,0.15);
    border: 1px solid rgba(245,158,11,0.4);
    padding: 4px 16px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 2px;
    color: #fbbf24;
    display: none;
    z-index: 55;
  }
  #demo-badge.show { display: block; }

  #offline-notice {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(255,59,59,0.15);
    border: 1px solid rgba(255,59,59,0.4);
    padding: 6px 20px;
    font-size: 11px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,120,120,0.85);
    display: none;
    z-index: 55;
  }
  #offline-notice.show { display: block; }
</style>
</head>
<body>

<!-- Barra de herramientas del modo interactivo (?edit=true) -->
<div id="edit-toolbar">
  <span class="edit-toolbar-title">✋ MODO MOVER ELEMENTOS · FORTNITE OVERLAY</span>
  <button type="button" class="edit-btn" id="btn-test-alert">🔔 Probar Alerta</button>
  <button type="button" class="edit-btn warn" id="btn-reset-pos">↺ Resetear Posiciones</button>
</div>

<!-- Canvas partículas -->
<canvas id="particles"></canvas>

<!-- Línea de escaneo -->
<div class="scan-line"></div>

<!-- Decoraciones de esquina -->
<div class="corner tl">
  <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polyline points="0,40 0,0 40,0" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
    <polyline points="0,32 0,0 32,0" stroke="#00D4FF" stroke-width="1" opacity="0.25"/>
  </svg>
</div>
<div class="corner tr">
  <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polyline points="0,40 0,0 40,0" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
    <polyline points="0,32 0,0 32,0" stroke="#00D4FF" stroke-width="1" opacity="0.25"/>
  </svg>
</div>
<div class="corner bl">
  <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polyline points="0,40 0,0 40,0" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
    <polyline points="0,32 0,0 32,0" stroke="#00D4FF" stroke-width="1" opacity="0.25"/>
  </svg>
</div>
<div class="corner br">
  <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polyline points="0,40 0,0 40,0" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>

<script>
/* ──────────────────────────────────────────────────────────
   CONFIG (desde URL)
────────────────────────────────────────────────────────── */
const params      = new URLSearchParams(location.search);
const CHANNEL     = params.get('channel') || '';
const DEMO_MODE   = params.get('demo') === 'true';
const BACKEND_URL = params.get('backend') || 'http://localhost:3000';
let   EPIC_USER   = params.get('epic') || '';
let   STATS_MODE  = params.get('mode') || 'overall';
const LAYOUT      = params.get('layout') || 'stats';
const WIDGET_ONLY = params.get('widget') || '';
const HIDE_LAYERS = (params.get('hide') || '').split(',').map(s => s.trim()).filter(Boolean);
const EDIT_MODE   = params.get('edit') === 'true' || params.get('interactive') === 'true';
const POS_STORAGE_KEY = `sd_fn_tactical_pos_${CHANNEL || 'default'}`;

document.getElementById('broadcaster-name').textContent = CHANNEL || 'Stream';

/* ──────────────────────────────────────────────────────────
   MODO WIDGET INDEPENDIENTE (?widget=...) & FILTRO DE CAPAS (?hide=...)
────────────────────────────────────────────────────────── */
(function setupModularView() {
  if (WIDGET_ONLY) {
    document.body.classList.add('widget-standalone');
    document.body.setAttribute('data-active-widget', WIDGET_ONLY);
    const target = document.querySelector(`[data-widget-id="${WIDGET_ONLY}"]`);
    if (target) target.classList.add('widget-active');
    return;
  }

  HIDE_LAYERS.forEach(layerId => {
    const el = document.querySelector(`[data-widget-id="${layerId}"]`);
    if (el) el.classList.add('widget-hidden');
  });
})();

/* ──────────────────────────────────────────────────────────
   POSICIONES GUARDADAS & DRAG AND DROP (?edit=true)
────────────────────────────────────────────────────────── */
function loadSavedPositions() {
  if (WIDGET_ONLY) return;
  try {
    const raw = localStorage.getItem(POS_STORAGE_KEY);
    if (!raw) return;
    const map = JSON.parse(raw);
    Object.entries(map).forEach(([wid, pos]) => {
      const el = document.querySelector(`[data-widget-id="${wid}"]`);
      if (!el || !pos) return;
      el.style.left = `${pos.left}px`;
      el.style.top = `${pos.top}px`;
      el.style.right = 'auto';
      el.style.bottom = 'auto';
      if (wid === 'alerts') el.style.transform = 'none';
    });
  } catch {}
}

function saveWidgetPosition(wid, left, top) {
  try {
    const raw = localStorage.getItem(POS_STORAGE_KEY);
    const map = raw ? JSON.parse(raw) : {};
    map[wid] = { left: Math.round(left), top: Math.round(top) };
    localStorage.setItem(POS_STORAGE_KEY, JSON.stringify(map));
  } catch {}
}

function initEditMode() {
  loadSavedPositions();
  if (!EDIT_MODE || WIDGET_ONLY) return;

  document.body.classList.add('edit-mode');

  document.getElementById('btn-test-alert').addEventListener('click', () => {
    enqueueAlert({
      type: 'sub',
      user: 'CyberCommander',
      detail: 'Tier 1 · Alerta de Prueba',
      msg: '¡El módulo de alertas funciona genial!',
    });
  });

  document.getElementById('btn-reset-pos').addEventListener('click', () => {
    localStorage.removeItem(POS_STORAGE_KEY);
    location.reload();
  });

  document.querySelectorAll('[data-widget-id]').forEach(el => {
    let dragging = false;
    let startX = 0, startY = 0, origLeft = 0, origTop = 0;

    el.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      dragging = true;
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
      const rect = el.getBoundingClientRect();
      origLeft = rect.left;
      origTop = rect.top;
      startX = e.clientX;
      startY = e.clientY;
      el.style.left = `${origLeft}px`;
      el.style.top = `${origTop}px`;
      el.style.right = 'auto';
      el.style.bottom = 'auto';
      if (el.dataset.widgetId === 'alerts') el.style.transform = 'none';
    });

    el.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      el.style.left = `${origLeft + dx}px`;
      el.style.top = `${origTop + dy}px`;
    });

    el.addEventListener('pointerup', e => {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      const rect = el.getBoundingClientRect();
      saveWidgetPosition(el.dataset.widgetId, rect.left, rect.top);
    });
  });
}

/* ──────────────────────────────────────────────────────────
   ESTADO LOCAL & FORMATTERS
────────────────────────────────────────────────────────── */
let uptimeSeconds = 0;
let uptimeInterval = null;

function fmtNum(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000)     return (n / 1_000).toFixed(1) + 'K';
  return String(n);
}

function fmtTime(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return [h, m, sec].map(v => String(v).padStart(2,'0')).join(':');
}

function setStatWithPop(id, val) {
  const el = document.getElementById(id);
  if (!el) return;
  const next = String(val);
  if (el.textContent !== next) {
    el.textContent = next;
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
    setTimeout(() => el.classList.remove('pop'), 300);
  }
}

/* ──────────────────────────────────────────────────────────
   HUD UPDATE
────────────────────────────────────────────────────────── */
function applyHud(data) {
  setStatWithPop('val-viewers',   fmtNum(data.viewers     ?? 0));
  setStatWithPop('val-followers', fmtNum(data.followers   ?? 0));
  setStatWithPop('val-subs',      fmtNum(data.subscribers ?? 0));

  if (data.channelName || CHANNEL) {
    document.getElementById('broadcaster-name').textContent = data.channelName || CHANNEL;
  }

  const titleEl = document.getElementById('title-text');
  if (data.streamTitle) titleEl.textContent = data.streamTitle;
  if (data.gameName) {
    document.getElementById('game-label').textContent = data.gameName;
  }

  if (data.lastFollower) {
    document.getElementById('last-follow-name').textContent = data.lastFollower;
  }

  if (data.uptimeSeconds != null) {
    uptimeSeconds = data.uptimeSeconds;
    document.getElementById('val-uptime').textContent = fmtTime(uptimeSeconds);
  }

  if (!uptimeInterval && data.isLive) {
    uptimeInterval = setInterval(() => {
      uptimeSeconds++;
      document.getElementById('val-uptime').textContent = fmtTime(uptimeSeconds);
    }, 1000);
  }
}

/* ──────────────────────────────────────────────────────────
   COLA DE ALERTAS
────────────────────────────────────────────────────────── */
const alertQueue = [];
let alertBusy = false;
const ALERT_DURATION = 5200;

function enqueueAlert(cfg) {
  alertQueue.push(cfg);
  if (!alertBusy) processAlertQueue();
}

function processAlertQueue() {
  if (!alertQueue.length) { alertBusy = false; return; }
  alertBusy = true;
  const cfg = alertQueue.shift();
  showAlert(cfg);
  setTimeout(processAlertQueue, ALERT_DURATION + 300);
}

function showAlert({ type, user, detail, msg }) {
  const zone = document.getElementById('alert-zone');
  const card = document.createElement('div');
  card.className = `alert-card ${type}`;

  const typeLabels = {
    follow:     '✦ NUEVO FOLLOWER ✦',
    sub:        '★ NUEVO SUB ★',
    resub:      '★ RESUB ★',
    subgift:    '★ GIFTED SUB ★',
    bits:       '💎 BITS 💎',
    cheer:      '💎 CHEER 💎',
    raid:       '🚀 RAID ENTRANTE 🚀',
    redemption: '⚡ CANJEO ⚡',
  };

  card.innerHTML = `
    <div class="alert-type">${typeLabels[type] ?? type.toUpperCase()}</div>
    <div class="alert-user">${escHtml(user)}</div>
    ${detail ? `<div class="alert-detail">${escHtml(detail)}</div>` : ''}
    ${msg    ? `<div class="alert-msg">${escHtml(msg)}</div>` : ''}
  `;

  zone.appendChild(card);
  setTimeout(() => { if (card.parentNode) card.parentNode.removeChild(card); }, ALERT_DURATION + 100);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ──────────────────────────────────────────────────────────
   ÚLTIMO FOLLOW INDICATOR
────────────────────────────────────────────────────────── */
function showLastFollow(name) {
  if (!name) return;
  const el = document.getElementById('recent-follow');
  document.getElementById('last-follow-name').textContent = name;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 900);
}

/* ──────────────────────────────────────────────────────────
   FORTNITE STATS
────────────────────────────────────────────────────────── */
async function fetchFnStats() {
  const statusPill = document.getElementById('fn-api-status');
  if (!EPIC_USER) {
    try {
      const cfgRes = await fetch(`${BACKEND_URL}/fortnite/config`);
      if (cfgRes.ok) {
        const cfg = await cfgRes.json();
        if (cfg.epicUsername) EPIC_USER = cfg.epicUsername;
        if (cfg.statsMode) STATS_MODE = cfg.statsMode;
      }
    } catch {}
  }

  if (!EPIC_USER) {
    if (statusPill) statusPill.textContent = 'SIN EPIC ID';
    return;
  }

  try {
    const r = await fetch(`${BACKEND_URL}/fortnite/stats/${encodeURIComponent(EPIC_USER)}?mode=${STATS_MODE}`);
    if (!r.ok) {
      if (statusPill) statusPill.textContent = 'OFFLINE';
      return;
    }
    const data = await r.json();
    document.getElementById('fn-kills').textContent   = fmtNum(data.kills ?? 0);
    document.getElementById('fn-wins').textContent    = fmtNum(data.wins ?? 0);
    document.getElementById('fn-matches').textContent = fmtNum(data.matches ?? 0);
    document.getElementById('fn-kd').textContent      = Number(data.kd ?? 0).toFixed(2);
    document.getElementById('fn-winrate').textContent = Number(data.winRate ?? 0).toFixed(1) + '%';
    if (statusPill) {
      statusPill.textContent = EPIC_USER;
      statusPill.classList.add('ok');
    }
  } catch {
    if (statusPill) statusPill.textContent = 'ERROR';
  }
}

/* ──────────────────────────────────────────────────────────
   CHAT EN VIVO
────────────────────────────────────────────────────────── */
const MAX_CHAT_MSGS = 50;

function initChatLayout() {
  const el = document.getElementById('fn-chat');
  if (!el || WIDGET_ONLY === 'chat') return;
  el.classList.remove('left', 'right');
  if (LAYOUT === 'chat-right') {
    el.classList.add('right');
  } else {
    el.classList.add('left');
  }
}

function addChatMessage(displayName, text, color, platform, superChat) {
  const container = document.getElementById('fn-chat-msgs');
  if (!container) return;
  const row = document.createElement('div');
  row.className = 'fn-chat-msg';
  const isYt = platform === 'youtube';
  const badgeHtml = `<span style="display:inline-block;font-size:9px;font-weight:900;padding:1px 4px;border-radius:3px;margin-right:5px;background:${isYt ? '#ff0033' : '#9146ff'};color:#fff;vertical-align:middle;">${isYt ? 'YT' : 'TW'}</span>`;
  const scHtml = superChat?.formattedAmount ? `<span style="display:inline-block;font-size:9px;font-weight:900;padding:1px 4px;border-radius:3px;margin-right:5px;background:#ffb300;color:#000;vertical-align:middle;">SC ${escHtml(superChat.formattedAmount)}</span>` : '';
  row.innerHTML = `${badgeHtml}${scHtml}<span class="un" style="color:${escHtml(color || (isYt ? '#FF0033' : '#00D4FF'))}">${escHtml(displayName)}:</span> <span class="txt">${escHtml(text)}</span>`;
  container.appendChild(row);
  while (container.children.length > MAX_CHAT_MSGS) container.removeChild(container.firstChild);
  container.scrollTop = container.scrollHeight;
}

/* ──────────────────────────────────────────────────────────
   SOCKET.IO
────────────────────────────────────────────────────────── */
function initSocket() {
  let socket;
  try {
    socket = io(BACKEND_URL, { transports: ['websocket'] });
  } catch(e) {
    document.getElementById('offline-notice').classList.add('show');
    return;
  }

  socket.on('connect', () => {
    document.getElementById('offline-notice').classList.remove('show');
    socket.emit('join:channel', CHANNEL);

    fetch(`${BACKEND_URL}/hud/start-poll`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ channel: CHANNEL, interval: 10 })
    }).catch(() => {});

    fetch(`${BACKEND_URL}/hud/${CHANNEL}`)
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d) applyHud(d); })
      .catch(() => {});
  });

  socket.on('disconnect', () => {
    document.getElementById('offline-notice').classList.add('show');
  });

  socket.on('hud:update', applyHud);

  socket.on('channel:follow', ({ userDisplayName }) => {
    showLastFollow(userDisplayName);
    enqueueAlert({ type: 'follow', user: userDisplayName });
  });

  socket.on('channel:subscribe', ({ userDisplayName, tier, isGift }) => {
    if (isGift) return;
    const tierLabel = tier === '1000' ? 'Tier 1' : tier === '2000' ? 'Tier 2' : 'Tier 3';
    enqueueAlert({ type: 'sub', user: userDisplayName, detail: tierLabel });
  });

  socket.on('channel:subscription-message', ({ userDisplayName, tier, cumulativeMonths, messageText }) => {
    const tierLabel = tier === '1000' ? 'Tier 1' : tier === '2000' ? 'Tier 2' : 'Tier 3';
    enqueueAlert({
      type: 'resub',
      user: userDisplayName,
      detail: `${cumulativeMonths} meses · ${tierLabel}`,
      msg: messageText || undefined,
    });
  });

  socket.on('channel:subgift', ({ gifterDisplayName, amount, tier }) => {
    const tierLabel = tier === '1000' ? 'Tier 1' : tier === '2000' ? 'Tier 2' : 'Tier 3';
    enqueueAlert({
      type: 'subgift',
      user: gifterDisplayName,
      detail: `× ${amount} subs · ${tierLabel}`,
    });
  });

  socket.on('channel:cheer', ({ userDisplayName, bits, message }) => {
    enqueueAlert({
      type: 'bits',
      user: userDisplayName,
      detail: `${Number(bits || 0).toLocaleString()} bits`,
      msg: message || undefined,
    });
  });

  socket.on('channel:raid', ({ fromBroadcasterDisplayName, viewers }) => {
    enqueueAlert({
      type: 'raid',
      user: fromBroadcasterDisplayName,
      detail: `${Number(viewers || 0).toLocaleString()} espectadores`,
    });
  });

  socket.on('channel:redemption', ({ userDisplayName, rewardTitle }) => {
    enqueueAlert({ type: 'redemption', user: userDisplayName, detail: rewardTitle });
  });

  socket.on('chat:message', (d) => {
    addChatMessage(d.user?.displayName || 'Anónimo', d.text || '', d.user?.color, d.platform, d.superChat);
  });
}

/* ──────────────────────────────────────────────────────────
   PARTÍCULAS DE FONDO
────────────────────────────────────────────────────────── */
(function initParticles() {
  if (WIDGET_ONLY) return;
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  canvas.width  = 1920;
  canvas.height = 1080;

  const COUNT = 55;
  const colors = ['#00D4FF', '#C84BFF', '#FFD700'];

  const particles = Array.from({ length: COUNT }, () => ({
    x: Math.random() * 1920,
    y: Math.random() * 1080,
    r: Math.random() * 1.4 + 0.3,
    vx: (Math.random() - 0.5) * 0.35,
    vy: (Math.random() - 0.5) * 0.35,
    color: colors[Math.floor(Math.random() * colors.length)],
    alpha: Math.random() * 0.45 + 0.1,
  }));

  function drawGrid() {
    ctx.strokeStyle = 'rgba(0,212,255,0.035)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= 1920; x += 80) {
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,1080); ctx.stroke();
    }
    for (let y = 0; y <= 1080; y += 80) {
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(1920,y); ctx.stroke();
    }
  }

  function tick() {
    ctx.clearRect(0, 0, 1920, 1080);
    drawGrid();

    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0)    p.x = 1920;
      if (p.x > 1920) p.x = 0;
      if (p.y < 0)    p.y = 1080;
      if (p.y > 1080) p.y = 0;

      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  tick();
})();

   BOOT
────────────────────────────────────────────────────────── */
initEditMode();

function loadSocketIO(cb) {
  const script = document.createElement('script');
  script.onload = () => cb();
  script.onerror = () => cb(new Error('load failed'));
  script.src = './js/socket.io.js';
  document.head.appendChild(script);
}

loadSocketIO(function(err) {
  if (!err) {
    initSocket();
  } else {
    setTimeout(() => loadSocketIO(function(err2) {
      if (!err2) initSocket();
    }), 3000);
  }
  initChatLayout();

  if (DEMO_MODE) {
    document.getElementById('demo-badge').classList.add('show');
    startDemo();
  }
  fetchFnStats();
  setInterval(fetchFnStats, 5 * 60 * 1000);
});

  const demoStats = { kills: 15842, wins: 423, matches: 2310, kd: 3.28, winRate: 18.3 };
